appId: com.interviewcoach.desktop
productName: Coach de entrevistas
copyright: Jair Ayala
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# El addon nativo de Whisper no puede cargarse desde dentro del asar.
asarUnpack:
  - "**/node_modules/@kutalia/whisper-node-addon/**"
npmRebuild: false
afterPack: scripts/after-pack.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Coach-de-entrevistas-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  language: "3082"
publish:
  provider: github
  owner: Fenixfo
  repo: interview-coach
